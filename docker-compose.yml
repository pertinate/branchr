# Self-hosted deployment. Copy .env.example to .env and set PUBLIC_HOST / VOICE_SECRET.
services:
  api:
    build: .
    image: branchr
    command: ["api"]
    restart: unless-stopped
    ulimits:
      nofile: 1048576
    environment:
      API_BIND: 0.0.0.0:8080
      VOICE_SECRET: ${VOICE_SECRET:?set VOICE_SECRET in .env}
      # Where clients reach the SFU. Use wss:// behind a TLS proxy.
      SFU_URLS: ${SFU_URL:-ws://${PUBLIC_HOST}:8090/ws}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
      # branchr accounts: local (own accounts only), federated, or both. See README.
      AUTH_MODE: ${AUTH_MODE:-local}
      BRANCHR_ID_URL: ${BRANCHR_ID_URL:-}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # SQLite in ./data by default; or postgres://user:pass@host/db for your own Postgres.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/discord.db}
      # Files go to ./data/uploads unless an S3 bucket is set (see deploy/docker-compose.rustfs.yml).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  sfu:
    build: .
    image: branchr
    command: ["sfu"]
    restart: unless-stopped
    ulimits:
      nofile: 1048576
    depends_on: [api]
    environment:
      SFU_BIND: 0.0.0.0:8090
      VOICE_SECRET: ${VOICE_SECRET}
      # Public IP clients send media to (must be reachable over UDP).
      SFU_PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      SFU_UDP_PORT: 50000
      # One UDP port per worker; keep in sync with the port range below.
      SFU_WORKERS: ${SFU_WORKERS:-4}
    ports:
      - "8090:8090"
      - "50000-50003:50000-50003/udp"
