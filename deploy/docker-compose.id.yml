# branchr ID (central accounts, Discord sign-in) alongside an instance, with its own Postgres.
#   ID_DOMAIN=id.example.com DISCORD_CLIENT_ID=... DISCORD_CLIENT_SECRET=... ID_DB_PASSWORD=... \
#     docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#       [-f deploy/docker-compose.image.yml] -f deploy/docker-compose.id.yml up -d
# Discord must allow the redirect https://$ID_DOMAIN/auth/discord/callback.
services:
  id-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: branchr
      POSTGRES_PASSWORD: ${ID_DB_PASSWORD:?set ID_DB_PASSWORD}
      POSTGRES_DB: branchr
    volumes:
      - id-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchr -d branchr"]
      interval: 5s
      timeout: 5s
      retries: 20

  id:
    image: ${IMAGE:-branchr}
    command: ["branchr-id"]
    restart: unless-stopped
    depends_on:
      id-db:
        condition: service_healthy
    environment:
      ID_BIND: 0.0.0.0:8070
      # Behind Caddy; rate limits count the client address it forwards.
      TRUST_PROXY: "1"
      PUBLIC_URL: https://${ID_DOMAIN:?set ID_DOMAIN}
      DATABASE_URL: postgres://branchr:${ID_DB_PASSWORD}@id-db:5432/branchr
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
      # The desktop app, and the web client this host serves.
      ALLOWED_REDIRECTS: branchr://auth/callback,https://${DOMAIN}/
      # DM calls go through id-sfu (below); off unless ID_VOICE_SECRET is set.
      ID_SFU_URL: wss://${ID_DOMAIN}/sfu/ws
      ID_VOICE_SECRET: ${ID_VOICE_SECRET:-}

  # The SFU for DM calls, separate from the instance's. Started only with the "calls"
  # profile (COMPOSE_PROFILES=calls), since it needs its UDP ports open on the host.
  id-sfu:
    image: ${IMAGE:-branchr}
    command: ["sfu"]
    profiles: ["calls"]
    restart: unless-stopped
    ulimits:
      nofile: 1048576
    environment:
      SFU_BIND: 0.0.0.0:8090
      VOICE_SECRET: ${ID_VOICE_SECRET:-}
      SFU_PUBLIC_IP: ${PUBLIC_IP:-}
      SFU_UDP_PORT: ${ID_SFU_UDP_PORT:-52000}
      SFU_WORKERS: 2
    ports:
      - "${ID_SFU_UDP_PORT:-52000}-${ID_SFU_UDP_END:-52001}:${ID_SFU_UDP_PORT:-52000}-${ID_SFU_UDP_END:-52001}/udp"

  caddy:
    environment:
      ID_DOMAIN: ${ID_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.id:/etc/caddy/sites/id.caddy:ro

volumes:
  id-db:
