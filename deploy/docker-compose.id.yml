# branchr ID (central accounts, Discord sign-in) alongside an instance, with its own Postgres.
#   ID_DOMAIN=id.example.com DISCORD_CLIENT_ID=... DISCORD_CLIENT_SECRET=... ID_DB_PASSWORD=... \
#     docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#       [-f deploy/docker-compose.image.yml] -f deploy/docker-compose.id.yml up -d
# Discord must allow the redirect https://$ID_DOMAIN/auth/discord/callback.
services:
  id-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: branchr
      POSTGRES_PASSWORD: ${ID_DB_PASSWORD:?set ID_DB_PASSWORD}
      POSTGRES_DB: branchr
    volumes:
      - id-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchr -d branchr"]
      interval: 5s
      timeout: 5s
      retries: 20

  id:
    image: ${IMAGE:-branchr}
    command: ["branchr-id"]
    restart: unless-stopped
    depends_on:
      id-db:
        condition: service_healthy
    environment:
      ID_BIND: 0.0.0.0:8070
      # Behind Caddy; rate limits count the client address it forwards.
      TRUST_PROXY: "1"
      PUBLIC_URL: https://${ID_DOMAIN:?set ID_DOMAIN}
      DATABASE_URL: postgres://branchr:${ID_DB_PASSWORD}@id-db:5432/branchr
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
      # The desktop app, the app branchr ID serves (/app/), and the one the hub serves.
      ALLOWED_REDIRECTS: branchr://auth/callback,https://${ID_DOMAIN}/app/,https://${DOMAIN}/app/,https://${DOMAIN}/
      # branchr ID is also the front door: the product site at /, the app at /app/ (both
      # in the image), opening this hub by default (e.g. https://$ID_DOMAIN/h/home through
      # the relay).
      DEFAULT_HUB: ${DEFAULT_HUB:-https://${DOMAIN}}
      # Hubs with RELAY=1 learn the gateway from us (its certificate is in the relay's data).
      RELAY_QUIC: ${ID_DOMAIN}:7443
      RELAY_CERT: /relay/cert.der
      # DM calls go through id-sfu (below); off unless ID_VOICE_SECRET is set.
      ID_SFU_URL: wss://${ID_DOMAIN}/sfu/ws
      ID_VOICE_SECRET: ${ID_VOICE_SECRET:-}
    volumes:
      - relay-data:/relay:ro

  # The SFU for DM calls, separate from the instance's. Started only with the "calls"
  # profile (COMPOSE_PROFILES=calls), since it needs its UDP ports open on the host.
  id-sfu:
    image: ${IMAGE:-branchr}
    command: ["sfu"]
    profiles: ["calls"]
    restart: unless-stopped
    ulimits:
      nofile: 1048576
    environment:
      SFU_BIND: 0.0.0.0:8090
      VOICE_SECRET: ${ID_VOICE_SECRET:-}
      SFU_PUBLIC_IP: ${PUBLIC_IP:-}
      SFU_UDP_PORT: ${ID_SFU_UDP_PORT:-52000}
      SFU_WORKERS: 2
    ports:
      - "${ID_SFU_UDP_PORT:-52000}-${ID_SFU_UDP_END:-52001}:${ID_SFU_UDP_PORT:-52000}-${ID_SFU_UDP_END:-52001}/udp"

  # Plex-style access to hubs without a public address (at home): they dial out to this
  # gateway and are reached at https://$ID_DOMAIN/h/<name>/. Started only with the "relay"
  # profile; allow a hub with `docker compose exec relay branchr-relay add <name> - <udp-base> <ports>`.
  relay:
    image: ${IMAGE:-branchr}
    command: ["branchr-relay", "serve"]
    profiles: ["relay"]
    restart: unless-stopped
    environment:
      RELAY_DIR: /data/relay
      RELAY_QUIC: 0.0.0.0:7443
      RELAY_HTTP: 0.0.0.0:8800
      RELAY_PUBLIC: ${ID_DOMAIN}:7443
      # Hubs are let in by a pass from branchr ID naming their key (claimed hubs only).
      RELAY_ID_URL: https://${ID_DOMAIN}
      # Hubs take voice and video directly (branchr.us doesn't pay for their streams);
      # RELAY_MEDIA=on carries it too, e.g. on a gateway of your own.
      RELAY_MEDIA: ${RELAY_MEDIA:-off}
    volumes:
      - relay-data:/data/relay
    ports:
      - "7443:7443/udp"
      # Hubs' media; give each hub its own ports from this range when adding it.
      - "${RELAY_UDP_START:-53000}-${RELAY_UDP_END:-53009}:${RELAY_UDP_START:-53000}-${RELAY_UDP_END:-53009}/udp"

  caddy:
    environment:
      ID_DOMAIN: ${ID_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.id:/etc/caddy/sites/id.caddy:ro

volumes:
  id-db:
  relay-data:
