# Stores uploads in rustfs (S3-compatible object storage) instead of ./data/uploads.
#   RUSTFS_ACCESS_KEY=... RUSTFS_SECRET_KEY=... \
#     docker compose -f docker-compose.yml [-f deploy/docker-compose.public.yml] -f deploy/docker-compose.rustfs.yml up -d
# rustfs stays on the internal network and the API streams files to clients. Moving existing
# uploads over: docker compose ... run --rm api api migrate-storage
services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs:/data

  api:
    depends_on: [rustfs]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-branchr}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}

volumes:
  rustfs:
