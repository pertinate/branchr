appId: dev.branchr.desktop
productName: branchr
executableName: branchr
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - web/**
  - package.json
  # Main/preload are bundled by esbuild; only the native PipeWire addon is needed at runtime.
  - "!node_modules/**"
  - node_modules/@vencord/venmic/lib/**
  - node_modules/@vencord/venmic/prebuilds/venmic-addon-linux-x64/**
  - node_modules/@vencord/venmic/package.json
  - node_modules/pkg-prebuilds/**
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
# Native PipeWire addon must live outside the asar archive.
asarUnpack:
  - "**/node_modules/@vencord/venmic/**"
linux:
  target: AppImage
  syncDesktopName: true
  category: Network;InstantMessaging;Chat
  icon: build/icon.png
  maintainer: Pertinate
  desktop:
    entry:
      StartupWMClass: branchr
appImage:
  artifactName: branchr-${version}-${arch}.AppImage
win:
  target: nsis
  icon: build/icon.png
nsis:
  artifactName: branchr-${version}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: branchr
