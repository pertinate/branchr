# Builds the desktop app: Linux AppImage and Windows installer. Artifacts are attached to
# every run; pushing a `v*` tag also publishes them as a GitHub release.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["crates/**", "deploy/**", "Dockerfile", "docker-compose.yml", "**.md"]
  pull_request:
    paths: ["apps/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: --linux AppImage
            files: apps/desktop/release/*.AppImage
            name: linux
          - os: windows-latest
            target: --win nsis
            files: |
              apps/desktop/release/*-setup.exe
              apps/desktop/release/*-setup.exe.blockmap
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - name: Package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: branchr-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
