# Tests every push/PR (unit + browser e2e). On main, also publishes the server image to GHCR and deploys it.
#
# Deployment needs these secrets on the `production` environment (Settings → Environments),
# which only `main` may deploy to; without them the deploy job is skipped:
#   DEPLOY_HOST         user@host of a server provisioned with scripts/deploy-vps.sh
#   DEPLOY_SSH_KEY      private key authorized on that host
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # branchr ID runs on Postgres; its tests use a throwaway schema here.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace
      - name: Generated TypeScript protocol is up to date
        run: |
          pnpm gen:protocol
          git diff --exit-code packages/protocol || { echo "::error::run pnpm gen:protocol and commit"; exit 1; }
      - name: Typecheck
        run: |
          pnpm --filter web typecheck
          pnpm --filter desktop typecheck
      - name: Compose files are valid
        env:
          DOMAIN: chat.example.com
          PUBLIC_IP: 203.0.113.10
          VOICE_SECRET: ci
          IMAGE: ghcr.io/example/branchr:ci
          ID_DOMAIN: id.example.com
          ID_DB_PASSWORD: ci
          DISCORD_CLIENT_ID: ci
          DISCORD_CLIENT_SECRET: ci
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.image.yml config -q
          docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.image.yml -f deploy/docker-compose.id.yml config -q
          COMPOSE_PROFILES=calls ID_VOICE_SECRET=ci docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.image.yml -f deploy/docker-compose.id.yml config -q

  # Browser tests against a local stack (API + SFU + Vite, plus branchr ID with a stand-in
  # Discord): chat, voice, screen streaming, attachments, mentions, branchr sign-in. Local-only: Electron (needs a display), emotes (third-party APIs), and the
  # relay/load specs (several software video encoders at once overload a 4-vCPU runner).
  e2e:
    runs-on: ubuntu-24.04
    # The whole suite twice: SQLite with files on disk, and Postgres with files in rustfs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            storage: local
          - db: postgres
            storage: s3
    name: e2e (${{ matrix.db }}, ${{ matrix.storage }})
    services:
      # branchr ID runs on Postgres; its tests use a throwaway schema here.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-key
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        ports: ["9000:9000"]
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      E2E_INSTANCE_DB: ${{ matrix.db }}
      E2E_S3_ENDPOINT: ${{ matrix.storage == 's3' && 'http://localhost:9000' || '' }}
      E2E_S3_ACCESS_KEY: ci-access
      E2E_S3_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p api -p sfu -p id
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test app.spec attachments.spec noise.spec mentions.spec branchr-id.spec context-menus.spec multi-instance.spec user-panel.spec emotes.spec roles.spec bans.spec customization.spec social.spec explore.spec search.spec rail.spec embeds.spec slowmode.spec webhooks.spec
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.db }}-${{ matrix.storage }}
          path: tests/e2e/test-results
          if-no-files-found: ignore

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - id: check
        run: |
          # Logs of public repos are public: also mask the bare host, which would otherwise
          # show up unmasked in ssh errors (only the full user@host secret is masked).
          [ -n "$DEPLOY_HOST" ] && echo "::add-mask::${DEPLOY_HOST#*@}"
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST secret not set; skipping deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: SSH setup
        if: steps.check.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-image.sh "$DEPLOY_HOST"
