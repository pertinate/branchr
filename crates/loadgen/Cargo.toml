[package]
name = "loadgen"
edition.workspace = true
version.workspace = true
description = "Synthetic publisher + N viewers to benchmark the SFU"

[dependencies]
proto = { workspace = true, features = ["token"] }
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
