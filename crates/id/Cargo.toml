[package]
name = "id"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "branchr-id"
path = "src/main.rs"

[dependencies]
proto = { workspace = true, features = ["token"] }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
tower-http.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
url = "2"
futures.workspace = true
dashmap = "6"
throttle.workspace = true

[dev-dependencies]
futures.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
tokio-tungstenite = "0.30"
