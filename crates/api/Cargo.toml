[package]
name = "api"
edition.workspace = true
version.workspace = true

[dependencies]
proto = { workspace = true, features = ["token"] }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
tower-http.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite-bundled", "postgres", "migrate", "macros"] }
argon2 = "0.5"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
dashmap = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "stream"] }
parking_lot = "0.12"
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
rusty-s3 = "0.10"
url = "2.5.8"
tokio-util = { version = "0.7.20", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
